services:
  db:
    image: postgres:16-alpine
    container_name: cinema_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema_pass
      POSTGRES_DB: cinema
    ports:
      - "5433:5432"
    volumes:
      - cinema_pgdata:/var/lib/postgresql/data

volumes:
  cinema_pgdata:
